<!DOCTYPE html>
<html lang="{{- .Site.LanguageCode -}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>

  <!-- Custom Styles -->
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Open+Sans:400,500,600">
  <link rel="stylesheet" type="text/css" href="/embed/_shared/custom.css">

  <!-- Observable Styles -->
  <link rel="stylesheet" type="text/css" href="/embed/_shared/inspector.css">
</head>
<body>
  {{/* Read Parameters */}}
  {{- $notebook := .Params.notebook -}}
  {{- $cells := .Params.cells -}}

  {{/* Use 'em */}}
  <script type="module">
    // Import libraries + specific notebook
    import {Runtime, Inspector} from "https://cdn.jsdelivr.net/npm/@observablehq/runtime@5/dist/runtime.js";
    import notebook from "https://api.observablehq.com/{{- $notebook -}}.js?v=4";

    // Where + what to insert
    const target = document.querySelector("body");
    const cellNames = "{{- $cells -}}".split(",").map(d => d.trim());

    // Create divs
    const divs = {}
    for (let cellName of cellNames) {
      const id = cellName.toLocaleLowerCase().replace(/\s+/g, '-');
      const div = document.createElement(`div#${id}`);
      divs[cellName] = div;
      target.appendChild(div);
    }

    // Load notebook cells
    const runtime = new Runtime();
    const checkFn = name => { if (divs[name]) return new Inspector(divs[name]) };
    const main = runtime.module(notebook, checkFn);

    // Notify parent frame of height changes
    function sendResize() {
      const height = document.documentElement.scrollHeight;
      if (height < 100) return;
      const msg = JSON.stringify({ context: "iframe.resize", height });
      window.parent.postMessage(msg, "*");
    }
    new ResizeObserver(sendResize).observe(document.body);
    sendResize();

  </script>
</body>
</html>
