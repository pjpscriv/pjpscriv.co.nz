<!doctype html>
<html lang="en" style="overflow-y: hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Zealand 2026 Election Party Votes</title>

    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Open+Sans:400,500,600" />
    <link rel="stylesheet" type="text/css" href="/embed/_shared/custom.css" />

    <link rel="stylesheet" type="text/css" href="/embed/_shared/inspector.css" />
  </head>
  <body>
    <script>
      const DARK_MODE_CLASS = "dark-mode";
      const LOCAL_STORAGE_KEY = "dark-mode-enabled";
      const DARK_MODE_EXPIRY_TIME = 4 * 60 * 60;

      function getLocalStorageDarkModePref() {
        const storedDataRaw = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (!storedDataRaw) {
          return null;
        }
        try {
          const data = JSON.parse(storedDataRaw);
          if (typeof data === "object" && data !== null && "darkMode" in data && "savedAt" in data) {
            const now = Math.floor(Date.now() / 1000);
            if (now - data.savedAt <= DARK_MODE_EXPIRY_TIME) {
              return data.darkMode;
            } else {
              localStorage.removeItem(LOCAL_STORAGE_KEY);
              return null;
            }
          }
        } catch (e) {
          console.error("Error reading dark mode preference from localStorage:", e);
          localStorage.removeItem(LOCAL_STORAGE_KEY);
          return null;
        }
      }

      const localStoragePref = getLocalStorageDarkModePref();
      const browserColorPref = window.matchMedia("(prefers-color-scheme: dark)").matches;

      const darkModeEnabled = localStoragePref === null ? browserColorPref : localStoragePref;
      if (darkModeEnabled) {
        document.body.classList.add(DARK_MODE_CLASS);
      }

      window.addEventListener("load", () => {
        document.body.style.transition = "color 0.2s ease, background-color 0.2s ease";
      });
    </script>

    <script type="module">
      import { Runtime, Inspector } from "https://cdn.jsdelivr.net/npm/@observablehq/runtime@5/dist/runtime.js";
      import notebook from "https://api.observablehq.com/@pjpscriv\/nz-2026-election.js?v=4";

      const target = document.querySelector("body");
      const cellNames = " md_4, viewof party_chart_style, party_vote_legend, party_chart ".split(",").map((d) => d.trim());

      const divs = {};
      for (let cellName of cellNames) {
        const id = cellName.toLocaleLowerCase().replace(/\s+/g, "-");
        const div = document.createElement(`div#${id}`);
        divs[cellName] = div;
        target.appendChild(div);
      }

      const runtime = new Runtime();
      const checkFn = (name) => {
        if (divs[name]) return new Inspector(divs[name]);
      };
      const main = runtime.module(notebook, checkFn);

      function sendResize() {
        const height = document.body.scrollHeight + 30;
        if (height < 100) return;
        const msg = JSON.stringify({ context: "iframe.resize", height });
        window.parent.postMessage(msg, "*");
      }
      new ResizeObserver(sendResize).observe(document.body);
      sendResize();
    </script>
  </body>
</html>
