    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --card-bg: #fff;
        --card-text: #222;
        --card-text-muted: #555;
        --page-bg: #fff;
        --page-text-muted: #555;
      }

      body.dark-mode {
        --page-bg: #222;
        --page-text-muted: #aaa;
      }

      @page {
        size: 3.5in 2in;
        margin: 0;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Josefin Sans", sans-serif;
        background-color: var(--page-bg);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem 1rem;
        transition: background-color 0.2s ease;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .card {
        width: 3.5in;
        height: 2in;
        background-color: var(--card-bg);
        color: var(--card-text);
        box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6mm;
        padding: 4.5mm;
        overflow: hidden;
        flex-shrink: 0;
      }

      .card-qr {
        flex: 0 0 auto;
        width: 34mm;
        height: 34mm;
        image-rendering: pixelated;
      }

      .card-info {
        flex: 0 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .card-name {
        font-family: "Raleway", sans-serif;
        text-transform: uppercase;
        font-weight: 700;
        font-size: 5mm;
        line-height: 1.15;
        margin: 0 0 1mm;
      }

      .card-title {
        font-size: 3mm;
        color: var(--card-text-muted);
        margin: 0 0 3mm;
      }

      .card-contacts {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 1.3mm;
      }

      .card-contacts li {
        display: flex;
        align-items: center;
        gap: 1.5mm;
        max-width: 100%;
      }

      .card-contacts a {
        display: flex;
        align-items: center;
        gap: 1.5mm;
        max-width: 100%;
        font-size: 2.6mm;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .card-contacts svg {
        width: 3mm;
        height: 3mm;
        flex-shrink: 0;
        fill: currentColor;
      }

      .download-link {
        font-size: 0.85rem;
        color: var(--page-text-muted);
      }

      .download-link a {
        text-decoration: underline;
      }

      @media print {
        body {
          background-color: transparent;
          padding: 0;
          gap: 0;
          min-height: auto;
        }

        .card {
          box-shadow: none;
        }

        .download-link {
          display: none;
        }
      }
    </style>

    <script>
      const DARK_MODE_CLASS = "dark-mode";
      const LOCAL_STORAGE_KEY = "dark-mode-enabled";
      const DARK_MODE_EXPIRY_TIME = 4 * 60 * 60;

      function getLocalStorageDarkModePref() {
        const storedDataRaw = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (!storedDataRaw) {
          return null;
        }
        try {
          const data = JSON.parse(storedDataRaw);
          if (typeof data === "object" && data !== null && "darkMode" in data && "savedAt" in data) {
            const now = Math.floor(Date.now() / 1000);
            if (now - data.savedAt <= DARK_MODE_EXPIRY_TIME) {
              return data.darkMode;
            } else {
              localStorage.removeItem(LOCAL_STORAGE_KEY);
              return null;
            }
          }
        } catch (e) {
          console.error("Error reading dark mode preference from localStorage:", e);
          localStorage.removeItem(LOCAL_STORAGE_KEY);
          return null;
        }
      }

      const localStoragePref = getLocalStorageDarkModePref();
      const browserColorPref = window.matchMedia("(prefers-color-scheme: dark)").matches;

      const darkModeEnabled = localStoragePref === null ? browserColorPref : localStoragePref;
      if (darkModeEnabled) {
        document.body.classList.add(DARK_MODE_CLASS);
      }

      window.addEventListener("load", () => {
        document.body.style.transition = "color 0.2s ease, background-color 0.2s ease";
      });

      window.addEventListener("storage", (e) => {
        if (e.key !== LOCAL_STORAGE_KEY) return;
        const pref = getLocalStorageDarkModePref();
        const enabled = pref === null ? window.matchMedia("(prefers-color-scheme: dark)").matches : pref;
        document.body.classList.toggle(DARK_MODE_CLASS, enabled);
      });
    </script>
